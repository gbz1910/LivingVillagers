name: Build Living Villagers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Stage 2.1 project
        shell: bash
        run: |
          cat stage21.part1.b64 stage21.part2.b64 stage21.part3.b64 stage21.part4.b64 stage21.part5.b64 > stage21.b64
          base64 -d stage21.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Apply alpha.4 crash fix
        shell: bash
        run: |
          sed -i 's/Blocks.BLAST_FURNACE/Blocks.SMITHING_TABLE/g' project/src/main/java/com/gb/livingvillagers/registry/ModBlocks.java
          sed -i 's/mod_version=0.2.1-alpha.3/mod_version=0.2.1-alpha.4/g' project/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        working-directory: project
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: LivingVillagers-1.20.1-Stage2.1
          path: project/build/libs/*.jar

name: Build Living Villagers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct Stage 2 project
        shell: bash
        run: |
          cat stage2.part1.b64 stage2.part2.b64 stage2.part3.b64 stage2.part4.b64 > stage2.b64
          base64 -d stage2.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Apply 1.20.1 source fixes
        shell: bash
        run: |
          FILE="project/src/main/java/com/gb/livingvillagers/util/WorkerProfessionVisuals.java"
          sed -i '/import net.minecraft.world.entity.npc.VillagerProfessions;/d' "$FILE"
          sed -i 's/VillagerProfessions\.NONE/VillagerProfession.NONE/g' "$FILE"
          sed -i 's/VillagerProfessions\.FARMER/VillagerProfession.FARMER/g' "$FILE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        working-directory: project
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: LivingVillagers-1.20.1-Stage2
          path: project/build/libs/*.jar

name: Build Living Villagers Stage 2.4 alpha.11

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct alpha.11 project
        shell: bash
        run: |
          cat stage11.part{000..044}.b64 > stage11.b64
          base64 -d stage11.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Fix Minecraft 1.20.1 Heightmap import
        shell: bash
        run: |
          sed -i 's/import net.minecraft.world.level.Heightmap;/import net.minecraft.world.level.levelgen.Heightmap;/' project/lv_stage22/src/main/java/com/gb/livingvillagers/work/WorkerTaskManager.java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        working-directory: project/lv_stage22
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: LivingVillagers-1.20.1-Stage2.4-alpha.11
          path: project/lv_stage22/build/libs/*.jar

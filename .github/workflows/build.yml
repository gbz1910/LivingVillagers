name: Build Living Villagers

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct project
        shell: bash
        run: |
          cat project.part1.b64 project.part2.b64 project.part3.b64 project.part4.b64 > project.b64
          base64 -d project.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Fix command exception declarations
        shell: bash
        run: |
          FILE="project/src/main/java/com/gb/livingvillagers/command/LivingVillagersCommands.java"
          sed -i 's/private static int setProfession(CommandContext<CommandSourceStack> context) {/private static int setProfession(CommandContext<CommandSourceStack> context) throws com.mojang.brigadier.exceptions.CommandSyntaxException {/' "$FILE"
          sed -i 's/private static int showInfo(CommandContext<CommandSourceStack> context) {/private static int showInfo(CommandContext<CommandSourceStack> context) throws com.mojang.brigadier.exceptions.CommandSyntaxException {/' "$FILE"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        working-directory: project
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: LivingVillagers-1.20.1
          path: project/build/libs/*.jar

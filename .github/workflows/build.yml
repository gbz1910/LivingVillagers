name: Build Living Villagers Stage 2.2 alpha.7

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct alpha.7 project
        shell: bash
        run: |
          cat stage22a7.part1.b64 stage22a7.part2.b64 stage22a7.part3.b64 stage22a7.part4.b64 stage22a7.part5.b64 stage22a7.part6.b64 stage22a7.part7.b64 > stage22a7.b64
          base64 -d stage22a7.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        working-directory: project/lv_stage22
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: LivingVillagers-1.20.1-Stage2.2-alpha.7
          path: project/lv_stage22/build/libs/*.jar

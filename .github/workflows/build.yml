name: Build Living Villagers alpha.15 renderer fix

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct alpha.11 project
        shell: bash
        run: |
          cat stage11.part{000..044}.b64 > stage11.b64
          base64 -d stage11.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Apply alpha.15 renderer fix
        shell: bash
        run: |
          mkdir -p project/lv_stage22/src/main/java/com/gb/livingvillagers/client/render
          cp patches/a15_MinerAwareVillagerModel.java project/lv_stage22/src/main/java/com/gb/livingvillagers/client/render/MinerAwareVillagerModel.java
          cp patches/a15_LivingVillagerRenderer.java project/lv_stage22/src/main/java/com/gb/livingvillagers/client/render/LivingVillagerRenderer.java
          cp patches/a15_ClientModEvents.java project/lv_stage22/src/main/java/com/gb/livingvillagers/client/ClientModEvents.java
          printf '{\n  "villager": {\n    "hat": "partial"\n  }\n}\n' > project/lv_stage22/src/main/resources/assets/livingvillagers/textures/entity/villager/profession/miner.png.mcmeta
          cp project/lv_stage22/src/main/resources/assets/livingvillagers/textures/entity/villager/profession/miner.png.mcmeta project/lv_stage22/src/main/resources/assets/livingvillagers/textures/entity/zombie_villager/profession/miner.png.mcmeta
          sed -i 's/mod_version=0.2.1-alpha.11/mod_version=0.2.1-alpha.15/' project/lv_stage22/gradle.properties
          sed -i 's/import net.minecraft.world.level.Heightmap;/import net.minecraft.world.level.levelgen.Heightmap;/' project/lv_stage22/src/main/java/com/gb/livingvillagers/work/WorkerTaskManager.java

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        working-directory: project/lv_stage22
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: LivingVillagers-1.20.1-alpha.15
          path: project/lv_stage22/build/libs/*.jar

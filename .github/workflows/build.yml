name: Build Living Villagers alpha.20 village chest

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct alpha.18 project
        shell: bash
        run: |
          cat a18.part{000..012}.b64 > a18.b64
          base64 -d a18.b64 > project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Apply alpha.19 compatibility fixes
        shell: bash
        run: |
          sed -i 's/placed.sort(Comparator.comparingInt(BlockPos::getY).reversed());/placed.sort((a, b) -> Integer.compare(b.getY(), a.getY()));/' project/lv_stage22/src/main/java/com/gb/livingvillagers/work/WorkerTaskExecutor.java
          cp patches/a19_LumberjackCompatibilityEvents.java project/lv_stage22/src/main/java/com/gb/livingvillagers/event/LumberjackCompatibilityEvents.java

      - name: Apply alpha.20 village chest
        shell: bash
        run: |
          cat a20.patch.part000.b64 > a20_patch.b64
          base64 -d a20_patch.b64 > a20_patch.tar.gz
          tar -xzf a20_patch.tar.gz -C project/lv_stage22

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Forge mod
        working-directory: project/lv_stage22
        run: gradle --no-daemon clean build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: LivingVillagers-1.20.1-alpha.20
          path: project/lv_stage22/build/libs/*.jar
